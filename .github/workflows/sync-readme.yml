name: Sync README projects

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  repository_dispatch:
    types: [sync-projects]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-projects.mjs
      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/projects.json data/project-overrides.json portfolio/projects.json readme.md
          git diff --staged --quiet || git commit -m "chore: sync project catalog from GitHub"
          git push
